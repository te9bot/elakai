<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ELAKAI — অফলাইন</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --card: #fff;
        --ink: #0f172a;
        --muted: #475569;
        --line: #e2e8f0;
        --blue: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --card: #121c2e;
          --ink: #e8eefb;
          --muted: #9aa8bd;
          --line: #24303f;
          --blue: #4b83f7;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Noto Sans Bengali', system-ui, -apple-system, sans-serif;
      }
      .card {
        max-width: 26rem;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 4px 12px -4px rgb(15 23 42 / 0.1);
      }
      .icon {
        width: 60px; height: 60px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: var(--blue);
        display: grid;
        place-items: center;
      }
      h1 { font-size: 1.375rem; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { margin: 0 0 8px; color: var(--muted); line-height: 1.65; font-size: 0.9375rem; }
      .en { font-family: system-ui, sans-serif; font-size: 0.875rem; }
      button {
        margin-top: 20px;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 14px;
        background: var(--blue);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:active { transform: scale(0.985); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M2 2 22 22M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 3.5-2.3M1.4 9.4a15 15 0 0 1 4.2-2.7M22.6 9.4a15 15 0 0 0-9.8-2.9M12 20h.01" />
        </svg>
      </div>
      <h1>আপনি অফলাইনে আছেন</h1>
      <p>ইন্টারনেট সংযোগ পাওয়া যাচ্ছে না। সংযোগ ফিরে এলে আবার চেষ্টা করুন।</p>
      <p class="en">You are offline. Check your connection and try again.</p>
      <button onclick="location.reload()">আবার চেষ্টা করুন · Retry</button>
    </div>
  </body>
</html>
